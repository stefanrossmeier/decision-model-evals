models:
  jev:
    provider: openrouter_decisions
    model: typesafe/jev-1.13
    endpoint: https://openrouter.ai/api/alpha/decisions
    api_key_env: OPENROUTER_API_KEY
    deployment: hosted
    description: TypeSafe Jev 1.13 through OpenRouter Decisions API

  bosun:
    provider: systemone_http
    model: null
    endpoint: http://127.0.0.1:8000/v1/systemone
    deployment: local
    description: Hanno Labs Bosun v3.1 0.6B local Jev-compatible server

  decider:
    provider: systemone_http
    model: Mapika/decider-4b
    endpoint_env: DECIDER_URL
    endpoint: http://127.0.0.1:8011/v1/systemone
    deployment: local
    description: Mapika decider-4b v2.1 (Qwen3.5-4B-Base), native System One server

  semif:
    provider: systemone_http
    model: Qwen/Qwen3.5-4B
    endpoint_env: SEMIF_URL
    endpoint: http://127.0.0.1:8012/v1/systemone
    deployment: local
    description: SemIf direct option-logit scorer over pinned Qwen3.5-4B

  julia1:
    provider: systemone_http
    model: SupersonicLabs/Julia-1
    endpoint_env: JULIA1_URL
    endpoint: http://127.0.0.1:8013/v1/systemone
    deployment: local
    description: Supersonic Labs Julia 1 144.3M local decision model
    parameters:
      revision: a85b127321d580d65176c89ced8273f305745d85
      weights_sha256: df853bf7fe424420011f3d0c47a05d7341aa9eefa7fb9f203ea4aada4ad95b72
      torch: 2.14.0
      transformers: 5.0.0
      strict_encoding: true
      max_length: 8192
      head_length: 512
      marker_only_head: false

  luna-structured:
    provider: openrouter_structured_classifier
    model: openai/gpt-6-luna
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    deployment: hosted
    description: GPT-6 Luna via OpenRouter with reasoning none and strict semantic Structured Outputs
    parameters:
      reasoning_effort: none
      seed: 0
      max_tokens: 32
      provider_only: [OpenAI]
      allow_fallbacks: false
      require_parameters: true

  luna-classifier:
    provider: openrouter_verbalizer_classifier
    model: openai/gpt-6-luna
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    deployment: hosted
    description: GPT-6 Luna via OpenRouter using an abstract A/B/C verbalizer classifier
    parameters:
      reasoning_effort: none
      seed: 0
      max_tokens: 16
      provider_only: [OpenAI]
      allow_fallbacks: false
      require_parameters: true
